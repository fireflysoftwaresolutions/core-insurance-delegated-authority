components:
  schemas:
    BinderDTO:
      required:
      - binderNumber
      - binderStatus
      - carrierPartyId
      - contractId
      - coverholderDistributorId
      - effectiveFrom
      - lineOfBusiness
      - tenantId
      type: object
      properties:
        binderId:
          type: string
          format: uuid
          readOnly: true
        tenantId:
          type: string
          format: uuid
        binderNumber:
          maxLength: 64
          minLength: 0
          type: string
        contractId:
          type: string
          format: uuid
        carrierPartyId:
          type: string
          format: uuid
        coverholderDistributorId:
          type: string
          format: uuid
        lineOfBusiness:
          type: string
          enum:
          - MOTOR
          - PROPERTY
          - LIABILITY
          - LIFE
          - HEALTH
          - MARINE
          - AVIATION
          - ACCIDENT
          - OTHER
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: string
          format: date
        binderStatus:
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - SUSPENDED
          - EXPIRED
        currency:
          pattern: "[A-Z]{3}"
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AuthorityLimitDTO:
      required:
      - binderId
      - limitType
      type: object
      properties:
        authorityLimitId:
          type: string
          format: uuid
          readOnly: true
        binderId:
          type: string
          format: uuid
        limitType:
          type: string
          enum:
          - SUM_INSURED
          - PREMIUM
          - TERRITORY
          - LINE
        maximumAmount:
          type: number
        currency:
          pattern: "[A-Z]{3}"
          type: string
        territory:
          maxLength: 128
          minLength: 0
          type: string
        lineOfBusiness:
          type: string
          enum:
          - MOTOR
          - PROPERTY
          - LIABILITY
          - LIFE
          - HEALTH
          - MARINE
          - AVIATION
          - ACCIDENT
          - OTHER
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CoverholderAppointmentDTO:
      required:
      - appointedFrom
      - binderId
      - distributorId
      type: object
      properties:
        coverholderAppointmentId:
          type: string
          format: uuid
          readOnly: true
        binderId:
          type: string
          format: uuid
        distributorId:
          type: string
          format: uuid
        partyId:
          type: string
          format: uuid
        appointedFrom:
          type: string
          format: date
        appointedTo:
          type: string
          format: date
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    FilterOptions:
      type: object
      properties:
        caseInsensitiveStrings:
          type: boolean
        includeInheritedFields:
          type: boolean
      description: Filter options for customizing filter behavior
    FilterRequestAuthorityLimitDTO:
      required:
      - pagination
      type: object
      properties:
        filters:
          $ref: "#/components/schemas/AuthorityLimitDTO"
        rangeFilters:
          $ref: "#/components/schemas/RangeFilter"
        pagination:
          $ref: "#/components/schemas/PaginationRequest"
        options:
          $ref: "#/components/schemas/FilterOptions"
      description: Filter criteria
    PaginationRequest:
      type: object
      properties:
        pageNumber:
          type: integer
          description: The zero-based page number to retrieve.
          format: int32
          example: 0
          default: 0
        pageSize:
          type: integer
          description: The number of items per page.
          format: int32
          example: 10
          default: 10
        sortBy:
          type: string
          description: The field to sort the results by.
          example: name
        sortDirection:
          type: string
          description: "The direction of sorting, either ASC or DESC."
          example: DESC
          default: DESC
      description: "Represents a pagination request for retrieving paginated results,\
        \ including page number, size, sort field, and direction."
    RangeFilter:
      type: object
      properties:
        ranges:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/RangeObject"
          description: Map of field names to their range criteria
      description: Represents range filters for numeric fields
    RangeObject:
      type: object
      properties:
        from:
          type: object
          description: Start value of the range
        to:
          type: object
          description: End value of the range
      description: Represents a range with from and to values
    PaginationResponseAuthorityLimitDTO:
      type: object
      properties:
        content:
          type: array
          description: The list of items for the current page.
          items:
            $ref: "#/components/schemas/AuthorityLimitDTO"
        totalElements:
          type: integer
          description: The total number of elements across all pages.
          format: int64
        totalPages:
          type: integer
          description: The total number of pages based on the data size and page size.
          format: int32
        currentPage:
          type: integer
          description: "The current page number, typically zero-based."
          format: int32
      description: Represents a paginated response containing a list of items and
        pagination metadata.
    FilterRequestCoverholderAppointmentDTO:
      required:
      - pagination
      type: object
      properties:
        filters:
          $ref: "#/components/schemas/CoverholderAppointmentDTO"
        rangeFilters:
          $ref: "#/components/schemas/RangeFilter"
        pagination:
          $ref: "#/components/schemas/PaginationRequest"
        options:
          $ref: "#/components/schemas/FilterOptions"
      description: Filter criteria
    PaginationResponseCoverholderAppointmentDTO:
      type: object
      properties:
        content:
          type: array
          description: The list of items for the current page.
          items:
            $ref: "#/components/schemas/CoverholderAppointmentDTO"
        totalElements:
          type: integer
          description: The total number of elements across all pages.
          format: int64
        totalPages:
          type: integer
          description: The total number of pages based on the data size and page size.
          format: int32
        currentPage:
          type: integer
          description: "The current page number, typically zero-based."
          format: int32
      description: Represents a paginated response containing a list of items and
        pagination metadata.
    FilterRequestBinderDTO:
      required:
      - pagination
      type: object
      properties:
        filters:
          $ref: "#/components/schemas/BinderDTO"
        rangeFilters:
          $ref: "#/components/schemas/RangeFilter"
        pagination:
          $ref: "#/components/schemas/PaginationRequest"
        options:
